<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="widget">
            <input type="text" class="search" placeholder="Search" id="place">
            <button class="pos">
                <img src="seb.png" style="background-color: transparent; width: 30px;">
            </button>
            <div class="det" STYLE="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-stretch: expanded; width: 20px;">
                <img src="cloud.jpg" class="icon">
                <h2 class="city">CHENNAI</h2>
                <h1 class="temp">22° C</h1>
                <p class="desc">Light intensity in shower rain</p>
            </div>
        </div>
        <footer style="color: white">
            <h3 id="ida">WIND</h3>
            <h3 id="idb">HUMIDITY</h3>
            <h3 id="idc">FEELS LIKE</h3>
            <h3 id="da"> 5.8mph</h3>
            <h3 id="db"> 5.8%</h3>
            <h3 id="dc"> 5.8°C</h3>
        </footer>
        
    </body>
</html>
